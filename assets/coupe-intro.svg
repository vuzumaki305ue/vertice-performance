<g fill="#374d60" stroke="#8aa4b8" stroke-opacity=".4" stroke-width="1.5"><path d="M-9-51 9-51 15-16 5-5-5-5-15-16Z"/><path d="M-9-51 9-51 15-16 5-5-5-5-15-16Z" transform="rotate(72)"/><path d="M-9-51 9-51 15-16 5-5-5-5-15-16Z" transform="rotate(144)"/><path d="M-9-51 9-51 15-16 5-5-5-5-15-16Z" transform="rotate(216)"/><path d="M-9-51 9-51 15-16 5-5-5-5-15-16Z" transform="rotate(288)"/></g><circle r="15" fill="#101c28" stroke="#a4bbcb" stroke-width="3"/><circle r="4" fill="#93b0c9"/></g>
