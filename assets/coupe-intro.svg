<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Cupê esportivo Vértice em perfil</title>
<desc id="desc">Ilustração original de um esportivo escuro com rodas grandes e faróis azuis.</desc>
<defs>
  <linearGradient id="body" x1="0" y1="0" x2=".15" y2="1"><stop stop-color="#748da8" offset="0"/><stop stop-color="#2f4154" offset=".18"/><stop stop-color="#13202e" offset=".42"/><stop stop-color="#0a111b" offset=".71"/><stop stop-color="#1c3042" offset=".88"/><stop stop-color="#070b12" offset="1"/></linearGradient>
  <linearGradient id="roof" x1="0" y1="0" x2=".1" y2="1"><stop stop-color="#4a6581"/><stop stop-color="#162b43" offset=".25"/><stop stop-color="#090e17" offset=".76"/><stop stop-color="#1e3549" offset="1"/></linearGradient>
  <linearGradient id="glass" x1=".2" y1="0" x2=".8" y2="1"><stop stop-color="#2c5270"/><stop stop-color="#0d1e2f" offset=".5"/><stop stop-color="#02070d" offset="1"/></linearGradient>
  <linearGradient id="head" x1="0" x2="1"><stop stop-color="#dff7ff"/><stop offset=".42" stop-color="#73bfff"/><stop offset="1" stop-color="#1775ff"/></linearGradient>
  <linearGradient id="under" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#183957"/><stop offset="1" stop-color="#03050a"/></linearGradient>
  <radialGradient id="wheel" cx=".47" cy=".4" r=".7"><stop stop-color="#5d7590"/><stop offset=".3" stop-color="#1a2735"/><stop offset=".62" stop-color="#0a101a"/><stop offset=".86" stop-color="#03060c"/><stop offset="1" stop-color="#536477"/></radialGradient>
  <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop stop-color="#4a9fff" stop-opacity=".7"/><stop offset=".3" stop-color="#247aff" stop-opacity=".2"/><stop offset="1" stop-color="#247aff" stop-opacity="0"/></radialGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="20"/></filter>
  <filter id="beam"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
<!-- road shadow and blue reflection -->
<ellipse cx="624" cy="557" rx="543" ry="42" fill="#00050a" opacity=".7" filter="url(#blur)"/>
<ellipse cx="647" cy="560" rx="480" ry="18" fill="#1769be" opacity=".18" filter="url(#blur)"/>
<!-- ground light from front -->
<ellipse cx="1100" cy="488" rx="91" ry="81" fill="url(#glow)" opacity=".75"/>
